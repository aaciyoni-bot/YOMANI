                                allowedUsers: Array.from(new Set(['ADMIN1', loggedInUser].filter(Boolean))),
                                claudeSid: entry.sid,
                                claudeChat: entry.chat
                            };
                            byId.set(pid, proj);
                            addedProjects++;
                        } else {
                            proj.claudeSid = entry.sid;
                            proj.claudeChat = entry.chat;
                        }
                        entry.tasks.forEach(it => {
                            totalTasks++;
                            const tid = 'ct_' + claudeHash(entry.sid + '|' + it.t);
                            const existing = proj.tasks.find(x => x.id === tid);
                            if (existing) {
                                existing.text = it.t;
                                existing.claudePriority = it.p;
                            } else {
                                proj.tasks.push({ id: tid, text: it.t, isDone: !!it.done, dueDate: null, category: 'general', claudePriority: it.p });
                                addedTasks++;
                            }
                        });
                        const openCount = proj.tasks.filter(t => !t.isDone).length;
                        proj.status = openCount === 0 ? 'הושלם' : 'בעבודה';
                        changedPids.add(pid);
                    });

                    if (cloudMode && dbUser && db) {
                        merged.forEach(p => { if (changedPids.has(p.id)) saveProjectToCloud(p); });
                    }
                    return merged;
                });

                                                                    <button onClick={() => setActiveProjectId(task.projectId)} className="text-[11px] bg-blue-50 hover:bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full font-bold transition-colors border border-blue-200 flex items-center gap-1"><i className="fas fa-folder"></i>{task.projectName}</button>
                                                                    {task.claudePriority && (
                                                                        <span className={`text-[11px] px-2.5 py-1 rounded-full font-bold border ${getPriorityColor(task.claudePriority)}`}>{task.claudePriority}</span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                        {task.dueDate && (
                                                            <div className={`flex items-center gap-1.5 text-xs px-3 py-1.5 rounded-lg border shadow-sm ${isOverdue(task.dueDate) ? 'bg-red-50 text-red-700 border-red-200 font-bold' : 'bg-white text-slate-600 border-slate-200 font-medium'}`}>
                                                                {isOverdue(task.dueDate) ? <i className="fas fa-exclamation-circle"></i> : <i className="far fa-calendar-alt"></i>}{new Date(task.dueDate).toLocaleDateString('he-IL')}
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            {visibleProjects.flatMap(p => (Array.isArray(p?.tasks) ? p.tasks : []).filter(t => !t.isDone)).length === 0 && (
                                                <div className="text-center py-10 text-slate-500">
                                                    <i className="fas fa-glass-cheers text-4xl mb-4 text-emerald-400"></i>
                                                    <p className="font-medium text-lg">אין לך משימות פתוחות בכלל.</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
